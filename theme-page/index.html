    <h1>欢迎来到我的家乡：昆明</h1>
    <p>昆明，别称春城，是云南省的省会，四季如春，风景宜人。</p>
    <h2>地理位置</h2>
<p>昆明位于中国西南部，云贵高原中部，是滇中城市群的核心。海拔约1890米，气候温和，年平均气温15℃。</p>

<h2>特色美食</h2>
<ul>
    <li>过桥米线 —— 汤鲜味美，配料丰富</li>
    <li>汽锅鸡 —— 原汁原味，滋补养生</li>
    <li>烧饵块 —— 外酥里软，搭配酱料</li>
</ul>

<h2>著名景点</h2>
<ul>
    <li><a href="https://www.dianchi.com" target="_blank">滇池</a> —— 云南最大的淡水湖</li>
    <li><a href="https://www.stoneforest.com" target="_blank">石林</a> —— 世界自然遗产</li>
    <li><a href="https://www.xishan.com" target="_blank">西山</a> —— 俯瞰昆明全景</li>
</ul>
